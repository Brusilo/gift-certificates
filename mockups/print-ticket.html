<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Макет лежит в mockups/, все пути считаются от корня сайта -->
<base href="../">
<title>Билет для печати — лист А4</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="site.css?v=20261119154144">
<link rel="stylesheet" href="ticket.css?v=20261119154144">
<style>
/* Лист А4: лицевая сторона и оборот билета шириной 190 мм, под ними подсказка, как печатать */
@page{size:A4;margin:0}
html,body{margin:0;background:#fff}
.a4{width:210mm;height:297mm;box-sizing:border-box;padding:18mm 0 0;display:flex;flex-direction:column;align-items:center;gap:10mm}
.a4 .tk-box{width:190mm}
.a4 > p{margin:0;font-size:3.6mm;color:#555A7A;text-align:center;line-height:1.4}
.a4 > p b{color:#181C2D}
</style>
</head>
<body>
<div class="a4">
  <div class="tk-box" id="front"></div>
  <div class="tk-box" id="back"></div>
  <p><b>Как распечатать</b><br>Печать с&nbsp;двух сторон листа, переворот по&nbsp;длинному краю. Вырежьте билет по&nbsp;контуру.</p>
</div>
<script src="ticket.js?v=20261119154144"></script>
<script src="shared.js?v=20261119154144"></script>
<script>
const until = new Date(); until.setMonth(until.getMonth() + CONFIG.validityMonths);
const f = { amount: fmt(5000), to: 'Маша', from: 'Петя', msg: 'С днём рождения! Выбирай, куда поехать.', till: untilText(until) };
const t = findTicket(CONFIG.defaultTicket);
tkMount($('front'), 'front', t); tkFill($('front'), f);
tkMount($('back'), 'back', t); tkFill($('back'), f);
</script>
</body>
</html>
