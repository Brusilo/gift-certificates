<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подарочный сертификат Туту</title>
<meta name="robots" content="noindex">
<!-- Тема: Samsung Internet и авто-тёмный режим Chrome не перекрашивают страницы, у которых заявлена своя тёмная тема.
     Поэтому заявляем «light dark», а цвета везде задаём светлые сами (site.css) -->
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="site.css?v=20261126183135">
<link rel="stylesheet" href="ticket.css?v=20261126183135">
<style>
/* Сертификат для печати на одной стороне листа А4: ничего не вырезать и не переворачивать.
   Этот же лист уходит покупателю и получателю в PDF.
   Сверху открытка, ниже сиреневая часть (поздравление, «Как использовать», шаги, код), внизу синяя полоса (условия и поддержка).
   Шаги, номера и стрелки в тех же пропорциях, что на обороте билета на сайте, увеличены под ширину листа.
   Жирность: заголовки 700, тексты 500, поздравление 700, код 900, заголовки синей полосы 900 курсивом, как на билете */
@page{size:A4;margin:0}
html,body{background:#E9E6F5}
body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.a4{width:210mm;height:297mm;margin:24px auto;padding:6mm 10mm;background:#fff;box-shadow:0 10px 40px rgba(1,31,144,.15);display:flex;flex-direction:column;gap:2.5mm;overflow:hidden;color:#011F90}
.a4-card .tk{border-radius:5mm}

/* Сиреневая часть */
.a4-back{flex:1;min-height:0;display:flex;flex-direction:column;background:#F3F0FF;border-radius:5mm;padding:4mm 8mm 4.5mm}
/* Поздравление до 200 знаков: размер подбирается под длину, от 10 до 3,4 мм. Строки идут во всю ширину, без принудительного переноса */
.a4-wish{flex:1;display:flex;align-items:center;min-height:0;overflow:hidden;border-bottom:.45mm solid #D6C8FF;padding-bottom:2.5mm}
.a4-wish p{margin:0;font-size:10mm;font-weight:700;line-height:1.18;overflow-wrap:anywhere}
.a4-h{margin:2.5mm 0 2mm;font-size:4.6mm;line-height:1.1;font-weight:700;color:#011F90}

/* Шаги: на обороте билета блок 50,6 × 29 мм, здесь 56,7 × 32,5 мм, всё остальное во столько же раз крупнее (×1,12) */
.a4-steps{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:1.1mm;margin:0 0 3mm}
/* Текст сдвинут правее, чем на билете: на скошенной фигуре так он смотрится по центру */
.a4-step{position:relative;z-index:0;height:32.5mm;display:flex;align-items:center;gap:2.4mm;padding:0 4mm 0 8.6mm;color:#fff}
.a4-step svg{position:absolute;inset:0;z-index:-1;width:100%;height:100%}
/* Цифра по центру кружка: строка обрезана по высоте заглавных */
.a4-n{flex:none;width:6.7mm;height:6.7mm;border-radius:50%;background:#FD5623;display:flex;align-items:center;justify-content:center;font-size:3.8mm;line-height:1;font-weight:900}
.a4-n span{display:block;text-box:trim-both cap alphabetic}
.a4-step p{margin:0;font-size:3.8mm;font-weight:500;line-height:1.16;white-space:nowrap}
.a4-arr{position:absolute;z-index:2;top:50%;width:6.9mm;max-width:none;transform:translate(-50%,-50%)}

/* Код и срок */
.a4-code{background:#fff;border-radius:4mm;padding:2mm 7mm 2.5mm}
.a4-code-l{display:flex;justify-content:space-between;align-items:center;gap:4mm;font-size:4.6mm;font-weight:700}
/* Плашка срока: скругление как у кнопок, полей и пузырей сайта, а не капсула */
.a4-till{color:#fff;background:#011F90;border-radius:2mm;padding:1.3mm 3.4mm;font-size:3.8mm;line-height:1.2;font-weight:700;white-space:nowrap}
.a4-code-c{display:block;margin-top:1mm;font-size:7.8mm;line-height:1.1;font-weight:900;letter-spacing:.02em;white-space:nowrap}

/* Синяя полоса: три равные колонки, всё по центру. QR, потом транспорт, потом поддержка.
   Подписи всех трёх колонок одного размера и начертания (.a4-t) */
.a4-stub{flex:none;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;gap:6mm;background:#011F90;color:#fff;border-radius:5mm;padding:4mm 8mm}
.a4-c{display:flex;flex-direction:column;align-items:center;gap:3mm;text-align:center}
.a4-t{font-size:4.2mm;line-height:1.3;font-weight:600}
.a4-qr{width:36mm;height:36mm;border-radius:3mm;overflow:hidden;background:#fff}
.a4-qr img{width:100%;height:100%;display:block}
.a4-sup-h{font-size:7mm;line-height:1;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.a4-icons{display:grid;grid-template-columns:repeat(2,auto);gap:3mm 9mm;align-items:end}
.a4-icon{display:flex;flex-direction:column;align-items:center;gap:1.5mm}
.a4-icon i{height:10mm;display:flex;align-items:flex-end}
.a4-icon img{height:10mm;width:auto;max-width:none}
.a4-icon img.pl{height:10.5mm}
.a4-icon img.bd{height:8mm}
.a4-icon span{font-size:3.4mm;font-weight:500}

.screen-bar{max-width:210mm;margin:24px auto -8px;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 4px;font-size:14px;color:var(--text)}
@media print{
  html,body{background:#fff}
  .a4{margin:0;box-shadow:none}
  .screen-bar{display:none}
}
/* Встроенный предпросмотр в форме (?embed=1): только лист, без кнопки и полей вокруг */
html.embed,html.embed body{background:transparent;overflow:hidden}
.embed .screen-bar{display:none}
.embed .a4{margin:0;box-shadow:none}
</style>
</head>
<body>

<div class="screen-bar">
  <span>Так выглядит PDF, который приходит в письме. Печатается на одной стороне листа А4</span>
  <button type="button" class="btn btn-primary" onclick="print()" style="min-height:40px;padding:0 18px;font-size:15px">Печать</button>
</div>

<div class="a4" id="sheet">
  <div class="a4-card"><span class="tk-box" id="card"></span></div>

  <div class="a4-back">
    <div class="a4-wish"><p id="wish"></p></div>
    <h2 class="a4-h">Как использовать</h2>
    <div class="a4-steps" id="steps"></div>
    <div class="a4-code">
      <div class="a4-code-l"><span>Код сертификата</span><span class="a4-till" id="till"></span></div>
      <b class="a4-code-c" id="code"></b>
    </div>
  </div>

  <div class="a4-stub">
    <div class="a4-c">
      <div class="a4-t">Подробные условия<br>по&nbsp;QR-коду</div>
      <div class="a4-qr"><img src="assets/ticket/qr.svg" alt="QR-код с условиями сертификата"></div>
    </div>
    <div class="a4-c">
      <div class="a4-icons" id="icons"></div>
      <div class="a4-t">Любое направление<br>и&nbsp;любые даты</div>
    </div>
    <div class="a4-c">
      <div class="a4-sup-h">Поддержка<br>24/7</div>
      <div class="a4-t">в&nbsp;чате на&nbsp;tutu.ru<br>и&nbsp;в&nbsp;приложении Туту</div>
    </div>
  </div>
</div>

<script src="ticket.js?v=20261126183135"></script>
<script src="shared.js?v=20261126183135"></script>
<script>
// Данные сертификата из адреса, например certificate.html?amount=5000&design=meadow&to=Маша&from=Петя&msg=...
const p = new URLSearchParams(location.search);
// В предпросмотре формы пустые имена показываем подсказками, как на открытке, а не «Маша» и «Петя»
const embed = p.has('embed');
// Из письма имена приходят всегда, даже пустые: тогда образец «Маша» и «Петя» не подставляем
const real = embed || p.has('to') || p.has('from');
document.documentElement.classList.toggle('embed', embed);
const until = new Date(); until.setMonth(until.getMonth() + CONFIG.validityMonths);

// Короткие предлоги и союзы не остаются в конце строки
const nbsp = (s) => s.replace(/(^|[\s(«])(в|во|и|к|ко|с|со|о|об|у|на|не|за|по|до|от|из|а|но|я)\s+/gi, '$1$2 ');
// Открытка и поздравление. Форма присылает новые данные сообщением, лист перерисовывается без перезагрузки
function renderCert(c) {
  tkMount($('card'), 'card', findDesign(c.design || CONFIG.defaultDesign));
  tkFill($('card'), {
    amount: c.amount ? fmt(+c.amount) : '— ₽',
    to: real ? c.to : c.to || 'Маша',
    from: real ? c.from : c.from || 'Петя'
  });
  // Поздравление по умолчанию подходит к любому поводу. Больше 200 знаков не бывает, как в форме
  $('wish').textContent = nbsp((c.msg || 'Пусть впереди будет много отличных путешествий!').slice(0, 200));
  if (typeof fit === 'function' && $('steps').children.length) fit();
}
renderCert({ design: p.get('design'), amount: parseInt(p.get('amount'), 10) || (embed ? 0 : 3000), to: p.get('to'), from: p.get('from'), msg: p.get('msg') });
addEventListener('message', (e) => {
  if (e.origin === location.origin && e.data && e.data.type === 'cert') renderCert(e.data);
});
$('code').textContent = p.get('code') || 'XXXX-XXXX-XXXX-XXXX-XXXX';
$('till').textContent = 'Действует до ' + untilText(until);

// Шаги: фигура и стрелки с оборота билета, тексты оттуда же
const shape = `<svg viewBox="0 0 51.2 36" preserveAspectRatio="none" aria-hidden="true"><path fill="${TK_BERRY}" d="${TK_CARD}"/></svg>`;
const steps = [
  'Выберите билеты<br>или отель<br>на&nbsp;Туту',
  'При оплате<br>введите код<br>сертификата',
  'Заказ дороже&nbsp;–<br>доплатите картой,<br>дешевле&nbsp;–<br>отправим<br>сертификат<br>на&nbsp;остаток'
];
$('steps').innerHTML = `<img class="a4-arr" src="${TK}arrow-navy.svg" style="left:33.5%" alt=""><img class="a4-arr" src="${TK}arrow-navy.svg" style="left:66.5%" alt="">`
  + steps.map((t, i) => `<div class="a4-step">${shape}<span class="a4-n"><span>${i + 1}</span></span><p>${t}</p></div>`).join('');

// Что можно оплатить сертификатом
const icon = (f, cap, cls = '') => `<div class="a4-icon"><i><img class="${cls}" src="${TK}ic-${f}-w.svg" alt=""></i><span>${cap}</span></div>`;
$('icons').innerHTML = icon('train', 'Поезда') + icon('plane', 'Самолёты', 'pl') + icon('bus', 'Автобусы') + icon('bed', 'Отели', 'bd');

// Поздравление: самый крупный размер от 10 до 3,4 мм, при котором текст помещается в свою зону
function fitWish() {
  const zone = $('wish').parentElement, el = $('wish');
  const mm = $('sheet').offsetWidth / 210;
  const room = zone.clientHeight - 3 * mm;
  for (let fs = 10; fs >= 3.4; fs -= 0.2) {
    el.style.fontSize = fs.toFixed(1) + 'mm';
    if (el.offsetHeight <= room) break;
  }
}

// На экране лист уменьшается под ширину окна, в печати всегда настоящий А4
function fit() {
  const sheet = $('sheet');
  sheet.style.zoom = '';
  fitWish();
  const k = Math.min(1, (innerWidth - (embed ? 0 : 24)) / sheet.offsetWidth);
  if (k < 1) sheet.style.zoom = k;
}
addEventListener('resize', fit);
addEventListener('beforeprint', () => { $('sheet').style.zoom = ''; fitWish(); });
addEventListener('afterprint', fit);
fit();
// Шрифты догружаются позже, после них текст становится другой ширины
document.fonts.ready.then(fit);
</script>
</body>
</html>
